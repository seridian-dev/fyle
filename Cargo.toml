[package]
name = "fyle"
version = "0.10.0"
edition = "2021"
description = "A cyberpunk desktop file manager and native source editor"
authors = ["Fyle Team"]
license = "MIT"
repository = "https://github.com/seridian-dev/fyle"
default-run = "fyle"
keywords = ["file-manager", "gui", "egui", "cyberpunk", "icons"]
categories = ["filesystem", "gui"]

[features]
default = ["gui", "trash"]
gui = ["dep:eframe", "dep:egui", "dep:sysinfo", "syntax", "terminal"]
trash = ["dep:trash"]
syntax = ["dep:syntect"]
terminal = ["dep:portable-pty", "dep:vt100"]

[dependencies]
# GUI framework
eframe = { version = "0.27", optional = true }
egui = { version = "0.27", optional = true }

# File system and paths
dirs = "5.0"
url = "2"
walkdir = "2.5"

# System information
sysinfo = { version = "0.30", optional = true }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Local agent harness: authenticated loopback transport and PNG capture
getrandom = "0.2"
png = "0.17"

# Optional: Trash support (enabled with --features trash)
trash = { version = "4.0", optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[[bin]]
name = "fyle"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "fyle-cli"
path = "src/bin/fyle-cli.rs"
