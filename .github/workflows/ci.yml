name: CI
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --no-default-features
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev desktop-file-utils xvfb libgl1-mesa-dri
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features --features gui
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash -n install.sh && desktop-file-validate fyle.desktop
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 -m compileall -q scripts tests
      - run: cargo build --locked --bins
      - name: Exercise GUI and capture agent-visible state
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python3 scripts/gui_smoke.py --cli target/debug/fyle-cli --output-dir gui-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-state-and-screenshots
          path: |
            gui-artifacts
            ~/.local/share/fyle/diagnostics

  linux-packages:
    name: Validate Linux release packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - run: |
          sudo apt-get update
          sudo apt-get install -y curl dbus-daemon flatpak flatpak-builder libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev pkg-config
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint .github/workflows/ci.yml .github/workflows/release.yml
      - name: Build and package all Linux formats
        run: scripts/package_linux.sh "$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)" x86_64
      - name: Build AppImage
        run: scripts/package_appimage.sh "$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)" x86_64
      - name: Build Flatpak bundle
        run: scripts/package_flatpak.sh "$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)" x86_64

  nix-packages:
    name: Build Nix package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-22.04
          - name: ARM64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix package
        run: nix build --no-write-lock-file --print-build-logs .#default
