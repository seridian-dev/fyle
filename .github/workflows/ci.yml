name: CI
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --no-default-features
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev desktop-file-utils
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features --features gui
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash -n install.sh && desktop-file-validate fyle.desktop
      - run: python3 -m unittest discover -s tests -p "test_*.py"
